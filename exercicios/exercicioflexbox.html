<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>*, *::before, *::after{
            box-sizing: border-box;
        }
        body,h1,p{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(218, 233, 238);
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: black;
        }

        header{background-color: rgb(132, 235, 235);
            align-items: center;
            display: flex;
            flex-direction: row;
            min-height: 80px;
            margin-inline: auto;
            justify-content: space-around;

        }

        nav{
            
            background-color: rgb(238, 238, 146);
            width: 70%;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            border-radius: 8px;
        }

        a{
            text-decoration: none;
            font-weight: bolder;
            padding: 1rem;
            
            &:hover,
            &:focus {
                color: rgb(112, 112, 226);}
            }
        .cards{
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 1.2rem;
            margin-block: 2rem;
            flex-wrap: wrap;
            align-content: center;
        }
        .card{
            width: 250px;
            height: 200px;
            padding: 1rem;
            background-color: white;
            box-shadow: #161515 0 0 10px;
            margin-block-end: 2rem;
            border-radius: none;
        }

    </style>
</head>
<body>
    <header>
        <h1>Exercicio Flexbox</h1>
        <nav>
        <a href="">Inicio</a>
        <a href="">Noticias</a>
        <a href="">Cursos</a>
        <a href="">Contato</a>
    </nav>
    </header>
    

    <main class="cards">
        <article class="card" >
            <h2>Um</h2>
            <p>Lorem ipsum dolor sit amet.</p>
        </article>

        <article class="card">
            <h2>Dois</h2>
            <p>Lorem ipsum dolor sit amet.</p>
        </article>

        <article class="card">
            <h2>Três</h2>
            <p>Lorem ipsum dolor sit amet..</p>
        </article>

        <article class="card">
            <h2>Quatro</h2>
            <p>Lorem ipsum dolor sit amet.</p>
        </article>
    </main>

















    
</body>
</html>
