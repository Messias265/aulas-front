<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre o uso de titulos</title>
</head>
<body>
 <!-- COMENTARIO/ ANOTAÇÃO de HTML ( atalho CRTL;)-->
     <!-- A utilização de tags de titulo(heading)
      Segue uma logica de hierarquia. Exemplo: Para ter um <h3>, necessariamente devemos ter um antes de um <h2> e um <h1>
        Obs: Vai do h1 ate o h6 -->
  
    <h1>Gabriel Sant Anna Pardinho de Lima</h1>
    <h2>Jovem Aprendiz</h2>
    
    <h2>Cursos 3</h2>
        <h3>Empresa A</h3>
        <h3>Empresa B</h3>

    <h2>Formação</h2>
        <h3>Escola X</h3>
        <h3>Escola Y</h3>

    <h2>Informações</h2>
</body>
</html>
